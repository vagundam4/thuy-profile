<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nguyễn Thị Thu Thủy — TNT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      background: #fdf4f8;
      overflow: hidden;
      position: relative;
    }

    /* Animated background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 15% 40%, #fce4ec 0%, transparent 55%),
        radial-gradient(ellipse at 85% 15%, #ede7f6 0%, transparent 55%),
        radial-gradient(ellipse at 60% 85%, #e3f2fd 0%, transparent 55%),
        #fdf4f8;
    }

    /* Subtle dot pattern */
    .bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(180,100,140,0.08) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.35;
      animation: float 14s ease-in-out infinite;
    }
    .orb-1 { width: 380px; height: 380px; background: #f8bbd9; top: -120px; left: -80px; animation-delay: 0s; }
    .orb-2 { width: 280px; height: 280px; background: #d1c4e9; bottom: -60px; right: -60px; animation-delay: -5s; }
    .orb-3 { width: 220px; height: 220px; background: #b3e5fc; bottom: 80px; left: 40px; animation-delay: -9s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(25px, -25px) scale(1.04); }
      66% { transform: translate(-18px, 18px) scale(0.96); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 32px;
      padding: 48px 40px 40px;
      width: 360px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.8) inset,
        0 24px 64px rgba(180,100,140,0.14),
        0 4px 20px rgba(180,100,140,0.08);
    }

    /* Brand */
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(233,30,99,0.08);
      border: 1px solid rgba(233,30,99,0.18);
      border-radius: 20px;
      padding: 4px 14px;
      margin-bottom: 28px;
    }
    .brand-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #e91e63;
      box-shadow: 0 0 6px #e91e6380;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .brand-text {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #e91e63;
    }

    /* Avatar */
    .avatar-wrap {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
    }
    .avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #e91e63, #9c27b0, #e91e63, #ff9800, #e91e63);
      animation: spin 5s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .avatar-inner {
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: #fff;
      overflow: hidden;
    }
    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* Placeholder avatar */
    .avatar-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      background: linear-gradient(135deg, #fce4ec, #f8bbd9);
    }

    /* Name */
    .name {
      font-size: 1.45rem;
      font-weight: 800;
      background: linear-gradient(135deg, #880e4f 0%, #c2185b 50%, #9c27b0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    /* Position */
    .position {
      font-size: 0.85rem;
      font-weight: 500;
      color: #9e9e9e;
      letter-spacing: 0.5px;
      margin-bottom: 32px;
    }
    .position span {
      color: #e91e63;
      font-weight: 600;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(233,30,99,0.2), transparent);
      margin-bottom: 28px;
    }

    /* Buttons */
    .buttons { display: flex; flex-direction: column; gap: 12px; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      border: none;
      outline: none;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }

    .btn-zalo {
      background: linear-gradient(135deg, #0068ff, #0052cc);
      color: white;
      box-shadow: 0 8px 24px rgba(0,104,255,0.25);
    }
    .btn-zalo:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,104,255,0.38);
    }
    .btn-zalo:active { transform: translateY(0); }

    .btn-gift {
      background: linear-gradient(135deg, #e91e63, #9c27b0, #ff9800);
      background-size: 200% 200%;
      color: white;
      box-shadow: 0 8px 24px rgba(233,30,99,0.28);
      animation: gradientShift 3s ease infinite;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .btn-gift:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 32px rgba(233,30,99,0.45);
    }
    .btn-gift:active { transform: scale(0.98); }

    .btn-icon { font-size: 1.1rem; }

    /* Zalo SVG */
    .zalo-icon {
      width: 22px; height: 22px;
      background: white;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .zalo-icon svg { width: 16px; height: 16px; }

    /* Message form */
    .msg-section { margin-top: 20px; }

    .msg-toggle {
      width: 100%;
      background: rgba(233,30,99,0.06);
      border: 1px solid rgba(233,30,99,0.18);
      border-radius: 14px;
      color: #c2185b;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 12px;
      cursor: pointer;
      transition: all 0.25s;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .msg-toggle:hover {
      background: rgba(233,30,99,0.12);
      border-color: rgba(233,30,99,0.3);
    }

    .msg-form {
      display: none;
      margin-top: 14px;
      padding: 20px;
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(233,30,99,0.12);
      border-radius: 18px;
      text-align: left;
    }
    .msg-form.open { display: block; }

    .msg-form label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #9e9e9e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .msg-form input,
    .msg-form textarea {
      width: 100%;
      background: #fff;
      border: 1px solid rgba(233,30,99,0.18);
      border-radius: 10px;
      padding: 10px 14px;
      color: #333;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 14px;
      resize: none;
    }
    .msg-form input:focus,
    .msg-form textarea:focus {
      border-color: rgba(233,30,99,0.45);
    }
    .msg-form input::placeholder,
    .msg-form textarea::placeholder {
      color: #bdbdbd;
    }

    .btn-send {
      width: 100%;
      background: linear-gradient(135deg, #e91e63, #c2185b);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-send:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(233,30,99,0.35);
    }
    .btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .msg-status {
      margin-top: 10px;
      font-size: 0.82rem;
      text-align: center;
      border-radius: 8px;
      padding: 8px;
      display: none;
    }
    .msg-status.success {
      display: block;
      background: rgba(76,175,80,0.1);
      color: #388e3c;
      border: 1px solid rgba(76,175,80,0.25);
    }
    .msg-status.error {
      display: block;
      background: rgba(244,67,54,0.1);
      color: #c62828;
      border: 1px solid rgba(244,67,54,0.2);
    }

    /* Confetti canvas */
    #confetti {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
    }

    /* Game Modal */
    .game-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(253,244,248,0.88);
      backdrop-filter: blur(12px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .game-modal.open { display: flex; }

    .game-wrap {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      border: 2px solid rgba(233,30,99,0.2);
      box-shadow: 0 20px 60px rgba(233,30,99,0.18), 0 4px 20px rgba(0,0,0,0.1);
    }

    #gameCanvas { display: block; }

    .game-close {
      position: absolute;
      top: 12px; right: 12px;
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(233,30,99,0.2);
      border-radius: 50%;
      color: #c2185b;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
      transition: background 0.2s;
    }
    .game-close:hover { background: white; }

    .game-hint {
      margin-top: 14px;
      color: #bdbdbd;
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <canvas id="confetti"></canvas>

  <!-- Game Modal -->
  <div class="game-modal" id="gameModal">
    <div class="game-wrap">
      <button class="game-close" onclick="closeGame()">×</button>
      <canvas id="gameCanvas" width="320" height="480"></canvas>
    </div>
    <div class="game-hint">Nhấn Space / Click / Chạm để bơi</div>
  </div>

  <div class="card">
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-text">TNT</span>
    </div>

    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <div class="avatar-inner">
        <img src="avatar1.png" alt="Nguyễn Thị Thu Thủy">
      </div>
    </div>

    <div class="name">Nguyễn Thị Thu Thủy</div>
    <div class="position">Trưởng Phòng HCNS · <span>TNT</span></div>

    <div class="divider"></div>

    <div class="buttons">
      <a class="btn btn-zalo" href="https://zalo.me/0975472868" target="_blank">
        <div class="zalo-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.02 2 11c0 2.7 1.24 5.12 3.2 6.8L4 20l2.8-1.4C8.1 19.47 10 20 12 20c5.52 0 10-4.02 10-9S17.52 2 12 2z" fill="#0068ff"/>
            <text x="5.5" y="15.5" font-family="Arial" font-size="9" font-weight="bold" fill="white">Zalo</text>
          </svg>
        </div>
        Nhắn tin Zalo
      </a>

      <button class="btn btn-gift" onclick="launchConfetti()">
        <span class="btn-icon">🎁</span>
        Tặng quà
      </button>

      <button class="btn" style="background:rgba(233,30,99,0.07);border:1px solid rgba(233,30,99,0.18);color:#c2185b;" onclick="openGame()">
        <span class="btn-icon">🐟</span>
        Trò chơi
      </button>
    </div>

    <!-- Message Section -->
    <div class="msg-section">
      <button class="msg-toggle" onclick="toggleMsg()">
        <span>✉️</span> Để lại lời nhắn
      </button>
      <div class="msg-form" id="msgForm">
        <label>Tên của bạn</label>
        <input type="text" id="senderName" placeholder="Nhập tên của bạn...">
        <label>Lời nhắn</label>
        <textarea id="msgText" rows="4" placeholder="Nhập lời nhắn cho Thu Thủy..."></textarea>
        <button class="btn-send" id="sendBtn" onclick="sendMessage()">
          <span>📨</span> Gửi lời nhắn
        </button>
        <div class="msg-status" id="msgStatus"></div>
      </div>
    </div>
  </div>

  <script>
    // ===== CONFETTI (thay cho fireworks) =====
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let pieces = [];
    let animFrame;
    let running = false;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const CONFETTI_COLORS = [
      '#e91e63','#9c27b0','#ff9800','#2196f3',
      '#4caf50','#ff5722','#00bcd4','#ffeb3b',
      '#f48fb1','#ce93d8','#90caf9','#a5d6a7'
    ];

    class ConfettiPiece {
      constructor() {
        this.reset(true);
      }
      reset(fromTop = false) {
        this.x = Math.random() * canvas.width;
        this.y = fromTop ? -20 - Math.random() * 100 : Math.random() * canvas.height;
        this.w = Math.random() * 10 + 6;
        this.h = Math.random() * 5 + 3;
        this.color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        this.vx = (Math.random() - 0.5) * 3;
        this.vy = Math.random() * 3 + 2;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.18;
        this.alpha = 1;
        this.life = 180 + Math.random() * 120;
        this.age = 0;
        this.wave = Math.random() * Math.PI * 2;
        this.waveSpeed = Math.random() * 0.08 + 0.04;
        this.shape = Math.random() < 0.3 ? 'circle' : (Math.random() < 0.5 ? 'ribbon' : 'rect');
      }
      update() {
        this.age++;
        this.wave += this.waveSpeed;
        this.x += this.vx + Math.sin(this.wave) * 0.8;
        this.y += this.vy;
        this.vy += 0.04; // slight gravity
        this.angle += this.spin;
        this.alpha = this.age < 20 ? this.age / 20 : Math.max(0, 1 - (this.age - this.life + 40) / 40);
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = this.color;

        if (this.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, this.w / 2.2, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.shape === 'ribbon') {
          // thin ribbon
          ctx.fillRect(-this.w * 1.5, -this.h / 2, this.w * 3, this.h * 0.6);
        } else {
          ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
        }
        ctx.restore();
      }
      isDead() { return this.age > this.life || this.y > canvas.height + 40; }
    }

    class Spark {
      constructor(x, y) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        this.x = x; this.y = y;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 4;
        this.alpha = 1;
        this.color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        this.size = Math.random() * 3 + 2;
      }
      update() {
        this.vx *= 0.94;
        this.vy += 0.25;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.022;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      isDead() { return this.alpha <= 0; }
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces = pieces.filter(p => !p.isDead());
      pieces.forEach(p => { p.update(); p.draw(); });
      if (pieces.length > 0) {
        animFrame = requestAnimationFrame(loop);
      } else {
        running = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function launchConfetti() {
      // Burst sparks from center
      const cx = canvas.width / 2, cy = canvas.height / 2;
      for (let i = 0; i < 30; i++) pieces.push(new Spark(cx, cy));

      // Rain confetti from top in waves
      let wave = 0;
      const totalWaves = 6;
      function addWave() {
        if (wave >= totalWaves) return;
        const count = 25 + Math.floor(Math.random() * 20);
        for (let i = 0; i < count; i++) pieces.push(new ConfettiPiece());
        wave++;
        // Also add corner bursts
        if (wave === 1 || wave === 3) {
          const bx = wave === 1 ? canvas.width * 0.2 : canvas.width * 0.8;
          const by = canvas.height * 0.25;
          for (let i = 0; i < 20; i++) pieces.push(new Spark(bx, by));
        }
        setTimeout(addWave, 280);
      }
      addWave();

      if (!running) { running = true; loop(); }
    }

    // ===== FLAPPY FISH GAME =====
    const gc = document.getElementById('gameCanvas');
    const gx = gc.getContext('2d');
    const GW = gc.width, GH = gc.height;

    const FISH_R = 15, PIPE_W = 50, PIPE_GAP = 148, PIPE_SPEED = 2.2, GRAVITY = 0.36, FLAP = -7;
    const FC = { pipe: '#26a69a', pipeDark: '#00796b', pipeCap: '#80cbc4', fish: '#ff7043', fishBelly: '#ffccbc', fishFin: '#ff5722', bubble: 'rgba(255,255,255,0.5)' };

    let fish, seaweeds, score, best, gameState, gLoop, pipeTimer;
    let bubbles = [];

    function resetGame() {
      fish = { x: 80, y: GH / 2, vy: 0, angle: 0 };
      seaweeds = [];
      bubbles = [];
      score = 0;
      if (best === undefined) best = 0;
      gameState = 'ready';
      pipeTimer = 0;
      // pre-spawn some bubbles
      for (let i = 0; i < 12; i++) spawnBubble(true);
    }

    function spawnBubble(anywhere) {
      bubbles.push({
        x: Math.random() * GW,
        y: anywhere ? Math.random() * GH : GH + 10,
        r: Math.random() * 4 + 2,
        vy: -(Math.random() * 0.6 + 0.3),
        alpha: Math.random() * 0.5 + 0.3
      });
    }

    function spawnPipe() {
      const top = 70 + Math.random() * (GH - PIPE_GAP - 120);
      seaweeds.push({ x: GW, top, bottom: top + PIPE_GAP, passed: false });
    }

    function flapFish() {
      if (gameState === 'dead') { resetGame(); return; }
      if (gameState === 'ready') gameState = 'playing';
      fish.vy = FLAP;
    }

    function drawFish() {
      gx.save();
      gx.translate(fish.x, fish.y);
      const angle = Math.min(Math.max(fish.vy * 0.055, -0.45), 1.1);
      gx.rotate(angle);

      // Tail
      gx.fillStyle = FC.fishFin;
      gx.beginPath();
      gx.moveTo(-FISH_R + 2, 0);
      gx.lineTo(-FISH_R - 10, -9);
      gx.lineTo(-FISH_R - 10, 9);
      gx.closePath();
      gx.fill();

      // Body
      gx.fillStyle = FC.fish;
      gx.shadowBlur = 12; gx.shadowColor = '#ff8a65';
      gx.beginPath();
      gx.ellipse(0, 0, FISH_R + 2, FISH_R - 3, 0, 0, Math.PI * 2);
      gx.fill();
      gx.shadowBlur = 0;

      // Belly stripe
      gx.fillStyle = FC.fishBelly;
      gx.beginPath();
      gx.ellipse(2, 3, FISH_R - 4, FISH_R - 8, 0, 0, Math.PI * 2);
      gx.fill();

      // Dorsal fin
      gx.fillStyle = FC.fishFin;
      gx.beginPath();
      gx.moveTo(-4, -FISH_R + 3);
      gx.lineTo(4, -FISH_R + 3);
      gx.lineTo(1, -FISH_R - 6);
      gx.closePath();
      gx.fill();

      // Eye
      gx.fillStyle = '#37474f';
      gx.beginPath();
      gx.arc(FISH_R - 5, -4, 4, 0, Math.PI * 2);
      gx.fill();
      gx.fillStyle = '#fff';
      gx.beginPath();
      gx.arc(FISH_R - 4, -5, 1.5, 0, Math.PI * 2);
      gx.fill();

      // Mouth
      gx.strokeStyle = '#bf360c';
      gx.lineWidth = 1.5;
      gx.beginPath();
      gx.arc(FISH_R + 1, 2, 4, 0.2, 1.0);
      gx.stroke();

      gx.restore();
    }

    function drawSeaweed(p) {
      // Top seaweed (grows down)
      const grad1 = gx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
      grad1.addColorStop(0, FC.pipe); grad1.addColorStop(1, FC.pipeDark);
      gx.fillStyle = grad1;
      gx.fillRect(p.x, 0, PIPE_W, p.top);
      // Top cap (coral)
      gx.fillStyle = FC.pipeCap;
      gx.beginPath();
      gx.roundRect(p.x - 5, p.top - 20, PIPE_W + 10, 20, [8, 8, 0, 0]);
      gx.fill();
      // Coral bumps
      gx.fillStyle = '#e91e63';
      for (let i = 0; i < 3; i++) {
        gx.beginPath();
        gx.arc(p.x + 10 + i * 15, p.top - 20, 5, Math.PI, 0);
        gx.fill();
      }

      // Bottom seaweed (grows up)
      const grad2 = gx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
      grad2.addColorStop(0, FC.pipe); grad2.addColorStop(1, FC.pipeDark);
      gx.fillStyle = grad2;
      gx.fillRect(p.x, p.bottom, PIPE_W, GH - p.bottom);
      // Bottom cap
      gx.fillStyle = FC.pipeCap;
      gx.beginPath();
      gx.roundRect(p.x - 5, p.bottom, PIPE_W + 10, 20, [0, 0, 8, 8]);
      gx.fill();
      // Coral bumps bottom
      gx.fillStyle = '#e91e63';
      for (let i = 0; i < 3; i++) {
        gx.beginPath();
        gx.arc(p.x + 10 + i * 15, p.bottom + 20, 5, 0, Math.PI);
        gx.fill();
      }
    }

    function drawBg() {
      // Underwater gradient
      const grad = gx.createLinearGradient(0, 0, 0, GH);
      grad.addColorStop(0, '#e0f7fa');
      grad.addColorStop(0.5, '#b2ebf2');
      grad.addColorStop(1, '#80deea');
      gx.fillStyle = grad;
      gx.fillRect(0, 0, GW, GH);

      // Light rays
      gx.save();
      for (let i = 0; i < 5; i++) {
        gx.globalAlpha = 0.06;
        gx.fillStyle = '#fff';
        gx.beginPath();
        gx.moveTo(40 + i * 60, 0);
        gx.lineTo(20 + i * 60, GH);
        gx.lineTo(55 + i * 60, GH);
        gx.lineTo(70 + i * 60, 0);
        gx.fill();
      }
      gx.restore();

      // Bubbles
      bubbles.forEach(b => {
        gx.save();
        gx.globalAlpha = b.alpha;
        gx.strokeStyle = 'rgba(255,255,255,0.7)';
        gx.lineWidth = 1;
        gx.beginPath();
        gx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        gx.stroke();
        // Shine
        gx.fillStyle = 'rgba(255,255,255,0.3)';
        gx.beginPath();
        gx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.4, 0, Math.PI * 2);
        gx.fill();
        gx.restore();
      });

      // Sandy bottom
      gx.fillStyle = '#ffe0b2';
      gx.fillRect(0, GH - 8, GW, 8);
    }

    function drawUI() {
      gx.font = 'bold 36px Inter, sans-serif';
      gx.textAlign = 'center';
      gx.fillStyle = 'rgba(0,0,0,0.1)';
      gx.fillText(score, GW/2 + 2, 62);
      gx.fillStyle = '#00695c';
      gx.shadowBlur = 0;
      gx.fillText(score, GW/2, 60);

      if (gameState === 'ready') {
        gx.fillStyle = 'rgba(255,255,255,0.75)';
        gx.beginPath();
        gx.roundRect(GW/2 - 110, GH/2 - 44, 220, 88, 18);
        gx.fill();
        gx.font = 'bold 18px Inter, sans-serif';
        gx.fillStyle = '#00796b';
        gx.fillText('🐟 Nhấn để bơi!', GW/2, GH/2 + 8);
      }

      if (gameState === 'dead') {
        gx.fillStyle = 'rgba(255,255,255,0.82)';
        gx.beginPath();
        gx.roundRect(GW/2 - 115, GH/2 - 72, 230, 148, 20);
        gx.fill();
        gx.font = 'bold 24px Inter, sans-serif';
        gx.fillStyle = '#e91e63';
        gx.fillText('Cá bị mắc cạn! 🐟', GW/2, GH/2 - 28);
        gx.font = '15px Inter, sans-serif';
        gx.fillStyle = '#555';
        gx.fillText(`Điểm: ${score}   Cao nhất: ${best}`, GW/2, GH/2 + 8);
        gx.font = 'bold 14px Inter, sans-serif';
        gx.fillStyle = '#00796b';
        gx.fillText('Nhấn để bơi lại', GW/2, GH/2 + 46);
      }
    }

    function gameFrame() {
      // Update bubbles
      if (Math.random() < 0.04) spawnBubble(false);
      bubbles.forEach(b => { b.y += b.vy; });
      bubbles = bubbles.filter(b => b.y + b.r > 0);

      drawBg();

      if (gameState === 'playing') {
        fish.vy += GRAVITY;
        fish.y += fish.vy;

        pipeTimer++;
        if (pipeTimer > 95) { spawnPipe(); pipeTimer = 0; }
        seaweeds.forEach(p => p.x -= PIPE_SPEED);
        seaweeds = seaweeds.filter(p => p.x + PIPE_W > 0);

        seaweeds.forEach(p => {
          if (!p.passed && p.x + PIPE_W < fish.x) { p.passed = true; score++; if (score > best) best = score; }
        });

        const hit = fish.y - FISH_R < 0 || fish.y + FISH_R > GH - 8 ||
          seaweeds.some(p => fish.x + FISH_R - 6 > p.x && fish.x - FISH_R + 6 < p.x + PIPE_W &&
            (fish.y - FISH_R + 4 < p.top || fish.y + FISH_R - 4 > p.bottom));
        if (hit) gameState = 'dead';
      }

      seaweeds.forEach(drawSeaweed);
      drawFish();
      drawUI();
      gLoop = requestAnimationFrame(gameFrame);
    }

    function openGame() {
      document.getElementById('gameModal').classList.add('open');
      resetGame();
      if (gLoop) cancelAnimationFrame(gLoop);
      gameFrame();
    }

    function closeGame() {
      document.getElementById('gameModal').classList.remove('open');
      if (gLoop) cancelAnimationFrame(gLoop);
    }

    gc.addEventListener('click', flapFish);
    gc.addEventListener('touchstart', e => { e.preventDefault(); flapFish(); }, { passive: false });
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && document.getElementById('gameModal').classList.contains('open')) {
        e.preventDefault(); flapFish();
      }
    });

    // ===== TOGGLE MESSAGE FORM =====
    function toggleMsg() {
      const form = document.getElementById('msgForm');
      form.classList.toggle('open');
    }

    // ===== SEND MESSAGE (Telegram) =====
    const TG_TOKEN = '8679610062:AAHgcHt1Hyfunn9P1HfvBY7sloQ3TxTs75k';
    const TG_CHAT  = '6283486438';

    async function sendMessage() {
      const name   = document.getElementById('senderName').value.trim();
      const text   = document.getElementById('msgText').value.trim();
      const btn    = document.getElementById('sendBtn');
      const status = document.getElementById('msgStatus');

      if (!name || !text) {
        status.className = 'msg-status error';
        status.textContent = '⚠️ Vui lòng điền đầy đủ tên và lời nhắn!';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span>⏳</span> Đang gửi...';
      status.className = 'msg-status';

      const message = `💌 <b>Lời nhắn mới từ Digital Profile</b>\n\n👤 <b>Người gửi:</b> ${name}\n📝 <b>Nội dung:</b>\n${text}`;

      try {
        const res = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TG_CHAT, text: message, parse_mode: 'HTML' })
        });
        const data = await res.json();
        if (data.ok) {
          status.className = 'msg-status success';
          status.textContent = '✅ Lời nhắn đã được gửi thành công!';
          document.getElementById('senderName').value = '';
          document.getElementById('msgText').value = '';
          launchConfetti();
        } else {
          throw new Error(data.description);
        }
      } catch (err) {
        status.className = 'msg-status error';
        status.textContent = '❌ Gửi thất bại. Vui lòng thử lại!';
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>📨</span> Gửi lời nhắn';
      }
    }
  </script>
