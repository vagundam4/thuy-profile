<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nguyễn Thị Thu Thủy — JOYWORK</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      background: #fdf4f8;
      overflow: hidden;
      position: relative;
    }

    /* Animated background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 15% 40%, #fce4ec 0%, transparent 55%),
        radial-gradient(ellipse at 85% 15%, #ede7f6 0%, transparent 55%),
        radial-gradient(ellipse at 60% 85%, #e3f2fd 0%, transparent 55%),
        #fdf4f8;
    }

    /* Subtle dot pattern */
    .bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(180,100,140,0.08) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.35;
      animation: float 14s ease-in-out infinite;
    }
    .orb-1 { width: 380px; height: 380px; background: #f8bbd9; top: -120px; left: -80px; animation-delay: 0s; }
    .orb-2 { width: 280px; height: 280px; background: #d1c4e9; bottom: -60px; right: -60px; animation-delay: -5s; }
    .orb-3 { width: 220px; height: 220px; background: #b3e5fc; bottom: 80px; left: 40px; animation-delay: -9s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(25px, -25px) scale(1.04); }
      66% { transform: translate(-18px, 18px) scale(0.96); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 32px;
      padding: 48px 40px 40px;
      width: 360px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.8) inset,
        0 24px 64px rgba(180,100,140,0.14),
        0 4px 20px rgba(180,100,140,0.08);
    }

    /* Brand */
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(233,30,99,0.08);
      border: 1px solid rgba(233,30,99,0.18);
      border-radius: 20px;
      padding: 4px 14px;
      margin-bottom: 28px;
    }
    .brand-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #e91e63;
      box-shadow: 0 0 6px #e91e6380;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .brand-text {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #e91e63;
    }

    /* Avatar */
    .avatar-wrap {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
    }
    .avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #e91e63, #9c27b0, #e91e63, #ff9800, #e91e63);
      animation: spin 5s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .avatar-inner {
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: #fff;
      overflow: hidden;
    }
    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* Placeholder avatar */
    .avatar-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      background: linear-gradient(135deg, #fce4ec, #f8bbd9);
    }

    /* Name */
    .name {
      font-size: 1.45rem;
      font-weight: 800;
      background: linear-gradient(135deg, #880e4f 0%, #c2185b 50%, #9c27b0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    /* Position */
    .position {
      font-size: 0.85rem;
      font-weight: 500;
      color: #9e9e9e;
      letter-spacing: 0.5px;
      margin-bottom: 32px;
    }
    .position span {
      color: #e91e63;
      font-weight: 600;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(233,30,99,0.2), transparent);
      margin-bottom: 28px;
    }

    /* Buttons */
    .buttons { display: flex; flex-direction: column; gap: 12px; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      border: none;
      outline: none;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }

    .btn-zalo {
      background: linear-gradient(135deg, #0068ff, #0052cc);
      color: white;
      box-shadow: 0 8px 24px rgba(0,104,255,0.25);
    }
    .btn-zalo:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,104,255,0.38);
    }
    .btn-zalo:active { transform: translateY(0); }

    .btn-gift {
      background: linear-gradient(135deg, #e91e63, #9c27b0, #ff9800);
      background-size: 200% 200%;
      color: white;
      box-shadow: 0 8px 24px rgba(233,30,99,0.28);
      animation: gradientShift 3s ease infinite;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .btn-gift:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 32px rgba(233,30,99,0.45);
    }
    .btn-gift:active { transform: scale(0.98); }

    .btn-icon { font-size: 1.1rem; }

    /* Zalo SVG */
    .zalo-icon {
      width: 22px; height: 22px;
      background: white;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .zalo-icon svg { width: 16px; height: 16px; }

    /* Message form */
    .msg-section { margin-top: 20px; }

    .msg-toggle {
      width: 100%;
      background: rgba(233,30,99,0.06);
      border: 1px solid rgba(233,30,99,0.18);
      border-radius: 14px;
      color: #c2185b;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 12px;
      cursor: pointer;
      transition: all 0.25s;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .msg-toggle:hover {
      background: rgba(233,30,99,0.12);
      border-color: rgba(233,30,99,0.3);
    }

    .msg-form {
      display: none;
      margin-top: 14px;
      padding: 20px;
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(233,30,99,0.12);
      border-radius: 18px;
      text-align: left;
    }
    .msg-form.open { display: block; }

    .msg-form label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #9e9e9e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .msg-form input,
    .msg-form textarea {
      width: 100%;
      background: #fff;
      border: 1px solid rgba(233,30,99,0.18);
      border-radius: 10px;
      padding: 10px 14px;
      color: #333;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 14px;
      resize: none;
    }
    .msg-form input:focus,
    .msg-form textarea:focus {
      border-color: rgba(233,30,99,0.45);
    }
    .msg-form input::placeholder,
    .msg-form textarea::placeholder {
      color: #bdbdbd;
    }

    .btn-send {
      width: 100%;
      background: linear-gradient(135deg, #e91e63, #c2185b);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-send:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(233,30,99,0.35);
    }
    .btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .msg-status {
      margin-top: 10px;
      font-size: 0.82rem;
      text-align: center;
      border-radius: 8px;
      padding: 8px;
      display: none;
    }
    .msg-status.success {
      display: block;
      background: rgba(76,175,80,0.1);
      color: #388e3c;
      border: 1px solid rgba(76,175,80,0.25);
    }
    .msg-status.error {
      display: block;
      background: rgba(244,67,54,0.1);
      color: #c62828;
      border: 1px solid rgba(244,67,54,0.2);
    }

    /* Confetti canvas */
    #confetti {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <canvas id="confetti"></canvas>

  <div class="card">
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-text">JOYWORK</span>
    </div>

    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <div class="avatar-inner">
        <img src="avatar1.png" alt="Nguyễn Thị Thu Thủy">
      </div>
    </div>

    <div class="name">Nguyễn Thị Thu Thủy</div>
    <div class="position">Trưởng Phòng HCNS · <span>JOYWORK</span></div>

    <div class="divider"></div>

    <div class="buttons">
      <a class="btn btn-zalo" href="https://zalo.me/0975472868" target="_blank">
        <div class="zalo-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.02 2 11c0 2.7 1.24 5.12 3.2 6.8L4 20l2.8-1.4C8.1 19.47 10 20 12 20c5.52 0 10-4.02 10-9S17.52 2 12 2z" fill="#0068ff"/>
            <text x="5.5" y="15.5" font-family="Arial" font-size="9" font-weight="bold" fill="white">Zalo</text>
          </svg>
        </div>
        Nhắn tin Zalo
      </a>

      <button class="btn btn-gift" onclick="launchConfetti()">
        <span class="btn-icon">🎁</span>
        Tặng quà
      </button>
    </div>

    <!-- Message Section -->
    <div class="msg-section">
      <button class="msg-toggle" onclick="toggleMsg()">
        <span>✉️</span> Để lại lời nhắn
      </button>
      <div class="msg-form" id="msgForm">
        <label>Tên của bạn</label>
        <input type="text" id="senderName" placeholder="Nhập tên của bạn...">
        <label>Lời nhắn</label>
        <textarea id="msgText" rows="4" placeholder="Nhập lời nhắn cho Thu Thủy..."></textarea>
        <button class="btn-send" id="sendBtn" onclick="sendMessage()">
          <span>📨</span> Gửi lời nhắn
        </button>
        <div class="msg-status" id="msgStatus"></div>
      </div>
    </div>
  </div>

  <script>
    // ===== CONFETTI (thay cho fireworks) =====
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let pieces = [];
    let animFrame;
    let running = false;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const CONFETTI_COLORS = [
      '#e91e63','#9c27b0','#ff9800','#2196f3',
      '#4caf50','#ff5722','#00bcd4','#ffeb3b',
      '#f48fb1','#ce93d8','#90caf9','#a5d6a7'
    ];

    class ConfettiPiece {
      constructor() {
        this.reset(true);
      }
      reset(fromTop = false) {
        this.x = Math.random() * canvas.width;
        this.y = fromTop ? -20 - Math.random() * 100 : Math.random() * canvas.height;
        this.w = Math.random() * 10 + 6;
        this.h = Math.random() * 5 + 3;
        this.color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        this.vx = (Math.random() - 0.5) * 3;
        this.vy = Math.random() * 3 + 2;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.18;
        this.alpha = 1;
        this.life = 180 + Math.random() * 120;
        this.age = 0;
        this.wave = Math.random() * Math.PI * 2;
        this.waveSpeed = Math.random() * 0.08 + 0.04;
        this.shape = Math.random() < 0.3 ? 'circle' : (Math.random() < 0.5 ? 'ribbon' : 'rect');
      }
      update() {
        this.age++;
        this.wave += this.waveSpeed;
        this.x += this.vx + Math.sin(this.wave) * 0.8;
        this.y += this.vy;
        this.vy += 0.04; // slight gravity
        this.angle += this.spin;
        this.alpha = this.age < 20 ? this.age / 20 : Math.max(0, 1 - (this.age - this.life + 40) / 40);
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = this.color;

        if (this.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, this.w / 2.2, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.shape === 'ribbon') {
          // thin ribbon
          ctx.fillRect(-this.w * 1.5, -this.h / 2, this.w * 3, this.h * 0.6);
        } else {
          ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
        }
        ctx.restore();
      }
      isDead() { return this.age > this.life || this.y > canvas.height + 40; }
    }

    class Spark {
      constructor(x, y) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        this.x = x; this.y = y;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 4;
        this.alpha = 1;
        this.color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        this.size = Math.random() * 3 + 2;
      }
      update() {
        this.vx *= 0.94;
        this.vy += 0.25;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.022;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      isDead() { return this.alpha <= 0; }
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces = pieces.filter(p => !p.isDead());
      pieces.forEach(p => { p.update(); p.draw(); });
      if (pieces.length > 0) {
        animFrame = requestAnimationFrame(loop);
      } else {
        running = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function launchConfetti() {
      // Burst sparks from center
      const cx = canvas.width / 2, cy = canvas.height / 2;
      for (let i = 0; i < 30; i++) pieces.push(new Spark(cx, cy));

      // Rain confetti from top in waves
      let wave = 0;
      const totalWaves = 6;
      function addWave() {
        if (wave >= totalWaves) return;
        const count = 25 + Math.floor(Math.random() * 20);
        for (let i = 0; i < count; i++) pieces.push(new ConfettiPiece());
        wave++;
        // Also add corner bursts
        if (wave === 1 || wave === 3) {
          const bx = wave === 1 ? canvas.width * 0.2 : canvas.width * 0.8;
          const by = canvas.height * 0.25;
          for (let i = 0; i < 20; i++) pieces.push(new Spark(bx, by));
        }
        setTimeout(addWave, 280);
      }
      addWave();

      if (!running) { running = true; loop(); }
    }

    // ===== TOGGLE MESSAGE FORM =====
    function toggleMsg() {
      const form = document.getElementById('msgForm');
      form.classList.toggle('open');
    }

    // ===== SEND MESSAGE (Telegram) =====
    const TG_TOKEN = '8679610062:AAHgcHt1Hyfunn9P1HfvBY7sloQ3TxTs75k';
    const TG_CHAT  = '6283486438';

    async function sendMessage() {
      const name   = document.getElementById('senderName').value.trim();
      const text   = document.getElementById('msgText').value.trim();
      const btn    = document.getElementById('sendBtn');
      const status = document.getElementById('msgStatus');

      if (!name || !text) {
        status.className = 'msg-status error';
        status.textContent = '⚠️ Vui lòng điền đầy đủ tên và lời nhắn!';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span>⏳</span> Đang gửi...';
      status.className = 'msg-status';

      const message = `💌 <b>Lời nhắn mới từ Digital Profile</b>\n\n👤 <b>Người gửi:</b> ${name}\n📝 <b>Nội dung:</b>\n${text}`;

      try {
        const res = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TG_CHAT, text: message, parse_mode: 'HTML' })
        });
        const data = await res.json();
        if (data.ok) {
          status.className = 'msg-status success';
          status.textContent = '✅ Lời nhắn đã được gửi thành công!';
          document.getElementById('senderName').value = '';
          document.getElementById('msgText').value = '';
          launchConfetti();
        } else {
          throw new Error(data.description);
        }
      } catch (err) {
        status.className = 'msg-status error';
        status.textContent = '❌ Gửi thất bại. Vui lòng thử lại!';
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>📨</span> Gửi lời nhắn';
      }
    }
  </script>
</body>
</html>
